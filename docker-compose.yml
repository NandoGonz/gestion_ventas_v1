services:
  postgres:
    image: postgres:16-alpine
    container_name: ventas-postgres
    environment:
      POSTGRES_DB: gestion_ventas
      POSTGRES_USER: ventas_app
      POSTGRES_PASSWORD: ventas_app_dev_only
    ports:
      - "5432:5432"
    volumes:
      - ventas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventas_app -d gestion_ventas"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ventas-backend
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://ventas_app:ventas_app_dev_only@postgres:5432/gestion_ventas
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AUTO_CREATE_TABLES: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ventas-frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ventas_postgres_data:
